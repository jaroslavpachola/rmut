[workspace]
resolver = "2"
members = ["crates/rmut-core", "crates/rmut-session", "crates/rmut-front", "crates/rmut", "crates/rmut-egui"]

[workspace.package]
version = "2.16.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/jaroslavpachola/rmut"
readme = "README.md"

[workspace.dependencies]
rmut-core = { path = "crates/rmut-core", version = "2.16.5" }
rmut-session = { path = "crates/rmut-session", version = "2.16.5" }
rmut-front = { path = "crates/rmut-front", version = "2.16.5" }
anyhow = "1"
ratatui = "0.29"
# ratatui's own crossterm, with the poll(2) event source: the default
# mio one is edge-triggered and, when a resize and a key arrive in the
# same wakeup, returns the resize and leaves the key unread until the
# next one is typed.
crossterm = { version = "0.28.1", features = ["use-dev-tty"] }
egui_extras = { version = "0.36", default-features = false, features = ["image"] }
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
chrono = "0.4"
mailparse = "0.16"
regex-lite = "0.1"
# display columns: the pager wraps CJK and emoji at two apiece
unicode-width = "0.2"
rmpv = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
webpki-roots = "0.26"
