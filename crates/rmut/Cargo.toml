[package]
name = "rmut"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "rmut: a mutt-like mail client in Rust"
keywords = ["mail", "mutt", "maildir", "imap", "tui"]
categories = ["command-line-utilities", "email"]

[[bin]]
name = "rmut"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
libc = { workspace = true }
ratatui = { workspace = true }
regex-lite = { workspace = true }
rmut-core = { workspace = true }
rmut-session = { workspace = true }

[dev-dependencies]
tempfile = "3"
toml = { workspace = true }
