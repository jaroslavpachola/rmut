[package]
name = "rmut-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Core mail handling for rmut: maildir scanning, message parsing"
keywords = ["mail", "maildir", "mbox", "imap", "smtp"]
categories = ["email"]

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
mailparse = { workspace = true }
# markdown compose: the text/html half of a markdown draft
pulldown-cmark = { workspace = true }
# mailparse's own charset table, for rfc2047
charset = "0.1"
libc = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
rustls-native-certs = "0.8"
rustls-pemfile = "2"

[dev-dependencies]
tempfile = "3"
