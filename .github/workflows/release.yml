name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p rmut
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="rmut-$version-x86_64-linux"
          mkdir "$dir"
          cp target/release/rmut "$dir"/
          cp docs/rmut.1 README.md LICENSE "$dir"/
          tar czf "$dir.tar.gz" "$dir"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" rmut-*.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
